<title>Cast at 40 Pixels</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Silkscreen&family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* The squad page's dark arcade-cabinet look (a deliberate single dark look): line-ups per mission on
   the game's 384 px view, a viewer next to VINCENT, one card per sample, then what is left out. */
:root{
  --bg:#13101a; --panel:#1c1825; --panel2:#231e2e; --line:#30293c; --fg:#efe8dc; --mute:#a99fb3;
  --accent:#e8563b; --gold:#f0c95c; --sky:#99d9ea; --ok:#9fb46a; --boss:#d0587e; --npc:#6fb7c9;
  --display:"Silkscreen", ui-monospace, monospace;
  --body:"Atkinson Hyperlegible", system-ui, sans-serif;
  --mono:"JetBrains Mono", ui-monospace, Menlo, monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:16px;line-height:1.55;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:28px 72px}
.wrap{max-width:1100px;margin:0 auto;display:flex;flex-direction:column;gap:48px}
header{display:flex;flex-direction:column;gap:10px}
.eyebrow{font-family:var(--display);font-size:15px;letter-spacing:.08em;color:var(--accent);text-transform:uppercase}
h1{font-family:var(--display);font-weight:400;font-size:clamp(30px,6vw,50px);line-height:1.05;margin:0;text-wrap:balance}
h2{font-family:var(--display);font-weight:400;font-size:24px;margin:0;text-wrap:balance}
h3{font-family:var(--display);font-weight:400;font-size:17px;margin:0;letter-spacing:.02em}
p{margin:0;max-width:68ch}
.lede{color:var(--mute);font-size:18px}
section{display:flex;flex-direction:column;gap:14px;min-width:0}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
button{font-family:var(--display);font-size:14px;background:var(--panel);color:var(--fg);border:1px solid var(--line);padding:6px 11px;cursor:pointer;touch-action:manipulation}
button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:#13101a}
button:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.readout{font-family:var(--mono);font-size:13px;color:var(--mute)}
.push{margin-left:auto}
.strips{display:flex;flex-direction:column;align-items:safe center;gap:6px;background:#000;border:1px solid var(--line);padding:6px;overflow-x:auto;max-width:100%}
.strips canvas{display:block;flex:none;image-rendering:pixelated;image-rendering:crisp-edges}
.viewer{display:grid;grid-template-columns:minmax(0,1.7fr) minmax(0,1fr);gap:16px;align-items:start}
@media (max-width:820px){.viewer{grid-template-columns:1fr}}
.vbox{background:#000;border:1px solid var(--line);overflow:auto;max-width:100%;display:flex;justify-content:center;align-items:flex-end;min-height:260px;padding:10px}
.vbox canvas{image-rendering:pixelated;display:block}
.facts{background:var(--panel);border:1px solid var(--line);padding:14px 16px;display:flex;flex-direction:column;gap:10px;min-width:0}
.facts dl{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;margin:0;font-size:15px}
.facts dt{color:var(--mute);font-family:var(--mono);font-size:13px;padding-top:2px}
.facts dd{margin:0;min-width:0}
.chip{font-family:var(--display);font-size:11px;letter-spacing:.06em;text-transform:uppercase;padding:2px 7px;border:1px solid currentColor;display:inline-block;line-height:1.5}
.r-enemy{color:var(--accent)} .r-boss{color:var(--boss)} .r-npc{color:var(--npc)} .r-animal{color:var(--ok)} .r-ally{color:var(--gold)} .r-hero{color:var(--gold)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:16px}
.card{background:var(--panel);border:1px solid var(--line);display:flex;flex-direction:column;min-width:0}
.card .box{background:var(--panel2);height:230px;display:flex;align-items:flex-end;justify-content:center;gap:14px;padding:12px;overflow:hidden;cursor:zoom-in;position:relative;border:0;width:100%;font:inherit;color:inherit}
.card .box canvas,.card .box img{image-rendering:pixelated;display:block;max-width:100%}
.card .box .tag{position:absolute;top:8px;left:10px;font-family:var(--mono);font-size:11px;color:var(--mute)}
.card .pair{display:flex;flex-direction:column;align-items:center;gap:4px}
.card .pair small{font-family:var(--mono);font-size:11px;color:var(--mute)}
.card .body{padding:12px 14px 14px;display:flex;flex-direction:column;gap:7px;min-width:0}
.card .top{display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.card .pose{font-size:14px;color:var(--fg)}
.card .note{font-size:14px;color:var(--mute)}
.card .stats{font-family:var(--mono);font-size:12px;color:var(--mute)}
.card .one{display:flex;align-items:flex-end;gap:10px}
.card .one canvas{image-rendering:pixelated}
.list{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px;max-width:76ch}
.note2{border-left:3px solid var(--gold);padding:10px 14px;background:var(--panel)}
.scroll{overflow-x:auto;max-width:100%;border:1px solid var(--line);background:var(--panel2)}
table{border-collapse:collapse;width:100%;font-size:14px;min-width:640px}
th,td{text-align:left;vertical-align:top;padding:8px 12px;border-bottom:1px solid var(--line)}
th{font-family:var(--display);font-weight:400;font-size:12px;letter-spacing:.06em;color:var(--mute);text-transform:uppercase}
td.num{font-family:var(--mono);font-size:13px;white-space:nowrap}
</style>

<div class="wrap">
<header>
  <div class="eyebrow">Metal Swan 3 · art spike</div>
  <h1>The cast at 40 pixels</h1>
  <p class="lede" id="lede"></p>
</header>

<section aria-labelledby="h-line">
  <h2 id="h-line">Line-up on the game's view</h2>
  <p>Each strip is the game's 384 px wide view at a whole-number zoom. VINCENT stands first in every strip for scale.</p>
  <div class="bar" id="mtabs" role="group" aria-label="Mission"></div>
  <div class="strips" id="strips"></div>
</section>

<section aria-labelledby="h-view">
  <h2 id="h-view">Viewer</h2>
  <div class="bar"><span class="readout">Zoom</span><span class="bar" id="zooms" role="group" aria-label="Zoom"></span>
    <button id="vsBtn" aria-pressed="true" class="push">Next to VINCENT</button>
    <span class="bar" id="oldV" role="group" aria-label="Current game art"></span></div>
  <div class="viewer">
    <div class="vbox" id="vbox"><canvas id="vcan"></canvas></div>
    <div class="facts" id="vfacts"></div>
  </div>
</section>

<section aria-labelledby="h-all">
  <h2 id="h-all">Every sample</h2>
  <div class="bar" id="rtabs" role="group" aria-label="Filter"></div>
  <div class="bar"><button id="oldBtn" aria-pressed="false">Show the current game art beside each sample</button></div>
  <div class="grid" id="cards"></div>
</section>

<section aria-labelledby="h-num">
  <h2 id="h-num">Numbers</h2>
  <div class="scroll"><table id="nums"></table></div>
</section>

<section aria-labelledby="h-out">
  <h2 id="h-out">Notes and what is not here</h2>
  <div id="notes" style="display:flex;flex-direction:column;gap:14px"></div>
</section>
</div>

<script>

</script>
